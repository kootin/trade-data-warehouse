name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Full nightly load and report
        run: |
          python -m warehouse.loader --db ci.duckdb --days 5 --export exports
          python -m warehouse.report --db ci.duckdb
