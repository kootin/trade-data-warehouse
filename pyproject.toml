[project]
name = "trade-data-warehouse"
version = "0.1.0"
description = "Kimball star schema with SCD Type 2 dimensions on DuckDB, queryable from Trino"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
